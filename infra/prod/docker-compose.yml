version: '3.8'

# ============================================================
# Ambiente: PRODUÇÃO
# Deploy: automático via GitHub Actions no push para main
# Uso manual: docker compose -p laboris-prod --env-file .env up -d --build
# ============================================================

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: laboris-postgres-prod
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - laboris-data-prod:/var/lib/postgresql/data
      - ../../docker/db:/docker-entrypoint-initdb.d
    networks:
      - laboris-prod-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2000M
    restart: unless-stopped

  backend:
    build:
      context: ../../backend
    container_name: laboris-backend-prod
    ports:
      - "8080:8080"
    depends_on:
      - postgres-db
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - TOKEN_SECRET=${TOKEN_SECRET}
      - GOOGLE_MAPS_KEY=${GOOGLE_MAPS_KEY}
      - RESEND_KEY=${RESEND_KEY}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - JAVA_OPTS=-Xms512m -Xmx2g
    networks:
      - laboris-prod-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2500M
    restart: unless-stopped

  frontend:
    build:
      context: ../../frontend
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_GOOGLE_MAPS_API_KEY=${VITE_GOOGLE_MAPS_API_KEY}
    container_name: laboris-frontend-prod
    ports:
      - "3000:80"
    networks:
      - laboris-prod-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 510M
    restart: unless-stopped

volumes:
  laboris-data-prod:

networks:
  laboris-prod-net:
    driver: bridge
